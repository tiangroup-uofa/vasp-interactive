name: Mock unit tests

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "vasp_interactive/**"
      - "tests/test_interactive_protocol.py"
      - "tests/test_mpi_process_detection.py"
      - ".github/workflows/mock_unit_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "vasp_interactive/**"
      - "tests/test_interactive_protocol.py"
      - "tests/test_mpi_process_detection.py"
      - ".github/workflows/mock_unit_tests.yml"
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip pytest .
      - name: Run VASP-free protocol and MPI-process tests
        run: >-
          python -m pytest -q
          tests/test_interactive_protocol.py
          tests/test_mpi_process_detection.py
